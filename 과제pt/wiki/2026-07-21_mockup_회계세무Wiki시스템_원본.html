<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회계/세무 Wiki — 목업</title>
<style>
  :root{
    --blue:#3182F6; --blue-weak:#E8F3FF; --blue-deep:#1B64DA;
    --violet:#8B5CF6;
    --ink:#191F28; --gray-9:#333D4B; --gray-8:#2b3038; --gray-7:#4E5968; --gray-6:#6B7684;
    --gray-5:#8B95A1; --gray-4:#B0B8C1; --gray-3:#D1D6DB; --gray-2:#E5E8EB;
    --gray-1:#F2F4F6; --gray-05:#F9FAFB; --white:#fff;
    --radius:16px;
    --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--gray-1);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}

  /* ===== 상단 헤더 ===== */
  .topbar{height:60px;background:var(--white);border-bottom:1px solid var(--gray-2);display:flex;align-items:center;padding:0 24px;gap:18px;position:relative;z-index:10}
  .brand{display:flex;align-items:center;gap:12px;min-width:210px}
  .brand-logo{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;transition:.2s}
  .brand-name{font-weight:800;font-size:16px;letter-spacing:-.3px}
  .brand-sub{font-size:11px;color:var(--gray-5);font-weight:600;margin-top:1px}
  .company-switch{margin-left:2px;display:flex;background:var(--gray-1);border-radius:8px;padding:3px}
  .company-switch button{font-size:12px;font-weight:700;color:var(--gray-6);padding:5px 11px;border-radius:6px;transition:.15s}
  .company-switch button.on{background:var(--white);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .topbar-tabs{display:flex;gap:4px;margin-left:6px}
  .tab{font-size:15px;font-weight:700;color:var(--gray-5);padding:8px 18px;border-radius:10px;transition:.15s}
  .tab.on{color:var(--blue);background:var(--blue-weak)}
  .tab .owner{display:block;font-size:10px;font-weight:600;color:var(--gray-4);margin-top:1px}
  .tab.on .owner{color:var(--blue-deep);opacity:.75}

  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .search{display:flex;align-items:center;gap:8px;background:var(--gray-1);border-radius:10px;padding:9px 14px;width:240px;color:var(--gray-5);font-size:13px}
  .search input{border:none;background:none;outline:none;font-size:13px;flex:1;color:var(--ink)}
  .user{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-radius:12px;background:var(--gray-05);border:1px solid var(--gray-2)}
  .user-meta{text-align:right;line-height:1.25}
  .user-team{font-size:11px;color:var(--gray-5);font-weight:600}
  .user-name{font-size:13px;font-weight:800}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3182F6,#1B64DA);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}

  /* ===== 레이아웃 ===== */
  .layout{display:flex;height:calc(100vh - 60px)}

  /* ===== 좌측 사이드바 ===== */
  .sidebar{width:292px;background:var(--white);border-right:1px solid var(--gray-2);display:flex;flex-direction:column;flex-shrink:0}
  .side-head{padding:18px 20px 10px}
  .side-title{font-size:13px;font-weight:800;color:var(--gray-6);letter-spacing:.2px;margin-bottom:12px}
  .view-switch{display:flex;background:var(--gray-1);border-radius:10px;padding:3px}
  .view-switch button{flex:1;font-size:12.5px;font-weight:700;color:var(--gray-6);padding:8px 0;border-radius:7px;transition:.15s}
  .view-switch button.on{background:var(--white);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .tree{flex:1;overflow-y:auto;padding:6px 12px 24px}
  .tree::-webkit-scrollbar{width:8px}.tree::-webkit-scrollbar-thumb{background:var(--gray-3);border-radius:8px}

  .cat{margin-bottom:2px}
  .cat-head{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--gray-9);transition:.12s;width:100%;text-align:left}
  .cat-head:hover{background:var(--gray-05)}
  .cat-emoji{font-size:15px;width:18px;text-align:center}
  .cat-arrow{margin-left:auto;color:var(--gray-4);font-size:11px;transition:.2s}
  .cat.open .cat-arrow{transform:rotate(90deg)}
  .cat-items{display:none;padding:2px 0 6px 22px;margin-left:8px;border-left:1.5px solid var(--gray-2)}
  .cat.open .cat-items{display:block}
  .leaf{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--gray-7);font-weight:500;transition:.12s;width:100%;text-align:left}
  .leaf:hover{background:var(--gray-05);color:var(--gray-9)}
  .leaf.on{background:var(--blue-weak);color:var(--blue-deep);font-weight:700}
  .leaf .dot{width:5px;height:5px;border-radius:50%;background:var(--gray-4);flex-shrink:0}
  .leaf.on .dot{background:var(--blue)}

  .side-divider{margin:14px 20px 10px;border-top:1px solid var(--gray-2)}
  .common-label{padding:0 20px 6px;font-size:11px;font-weight:800;color:var(--gray-5);letter-spacing:.3px}
  .placeholder-note{margin:2px 12px 8px;font-size:11px;color:var(--gray-5);background:#FFF9EB;border:1px solid #FFE9AE;border-radius:8px;padding:8px 10px;line-height:1.5}

  /* ===== 우측 컨텐츠 ===== */
  .content{flex:1;overflow-y:auto;padding:32px 40px 60px}
  .content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--gray-3);border-radius:8px}
  .crumb{font-size:12px;color:var(--gray-5);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .crumb .sep{color:var(--gray-3)}
  .doc-title{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px}
  .doc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .chip{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--gray-1);color:var(--gray-6)}
  .chip.blue{background:var(--blue-weak);color:var(--blue-deep)}
  .chip.green{background:#E7F7EF;color:#0F9D58}
  .chip.red{background:#FDECEC;color:#E03E3E}
  .chip.amber{background:#FFF4DE;color:#B7791F}

  .card{background:var(--white);border:1px solid var(--gray-2);border-radius:var(--radius);padding:24px 26px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h3 .bar{width:4px;height:16px;background:var(--blue);border-radius:3px}
  .card p{font-size:14px;line-height:1.75;color:var(--gray-7)}
  .card p + p{margin-top:10px}
  .card strong{color:var(--ink);font-weight:700}
  .card ul{margin:6px 0 0 2px;padding:0;list-style:none}
  .card li{font-size:13.5px;line-height:1.7;color:var(--gray-7);padding-left:18px;position:relative}
  .card li::before{content:'';position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue)}

  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
  .flow .step{background:var(--gray-05);border:1px solid var(--gray-2);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--gray-9)}
  .flow .arrow{color:var(--gray-4);font-weight:800}
  .flow .step.hl{background:var(--blue-weak);border-color:#cfe3ff;color:var(--blue-deep)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--gray-2);vertical-align:top}
  th{font-size:12px;font-weight:800;color:var(--gray-6);background:var(--gray-05)}
  td{color:var(--gray-7);line-height:1.6}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--gray-9)}
  tr:last-child td{border-bottom:none}
  tr.total td{background:var(--blue-weak);font-weight:800;color:var(--blue-deep)}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .tag.g{background:#E7F7EF;color:#0F9D58}.tag.r{background:#FDECEC;color:#E03E3E}.tag.a{background:#FFF4DE;color:#B7791F}.tag.b{background:var(--blue-weak);color:var(--blue-deep)}

  .callout{display:flex;gap:12px;background:#FFF9EB;border:1px solid #FFE9AE;border-radius:12px;padding:14px 16px;margin-top:12px}
  .callout.blue{background:var(--blue-weak);border-color:#cfe3ff}
  .callout .ic{font-size:16px;flex-shrink:0}
  .callout p{font-size:13px;line-height:1.65;color:#8A6D1B;margin:0}
  .callout.blue p{color:var(--blue-deep)}
  .callout strong{color:#6b530f}.callout.blue strong{color:var(--blue-deep)}

  .kv{display:grid;grid-template-columns:150px 1fr;gap:11px 16px;font-size:13.5px}
  .kv .k{color:var(--gray-5);font-weight:700}
  .kv .v{color:var(--gray-9);font-weight:500;line-height:1.6}

  .check li::before{content:'✓';background:none;color:var(--blue);font-weight:800;font-size:13px;top:2px;left:0}
  .check li{padding-left:22px}

  .mock-note{position:fixed;bottom:16px;right:20px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:8px 14px;border-radius:20px;opacity:.82;z-index:50}
</style>
</head>
<body>

<!-- ===== 상단 헤더 ===== -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo" id="logo">K</div>
    <div>
      <div class="brand-name" id="companyName">키다리스튜디오</div>
      <div class="brand-sub">회계/세무 Wiki</div>
    </div>
    <div class="company-switch">
      <button class="on" onclick="switchCompany(this,'키다리스튜디오','K','#3182F6')">키다리</button>
      <button onclick="switchCompany(this,'레진엔터테인먼트','L','#8B5CF6')">레진</button>
    </div>
  </div>

  <nav class="topbar-tabs">
    <button class="tab on" data-tab="acc" onclick="switchTab('acc')">
      회계 <span class="owner">담당 · 문동진</span>
    </button>
    <button class="tab" data-tab="tax" onclick="switchTab('tax')">
      세무 <span class="owner">담당 · 이지윤</span>
    </button>
  </nav>

  <div class="topbar-right">
    <div class="search"><span>🔍</span><input placeholder="매뉴얼 검색"></div>
    <div class="user">
      <div class="user-meta">
        <div class="user-team" id="userTeam">재무관리부 회계팀</div>
        <div class="user-name" id="userName">문동진</div>
      </div>
      <div class="avatar" id="userAvatar">문</div>
    </div>
  </div>
</header>

<div class="layout">
  <!-- ===== 좌측 사이드바 ===== -->
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-title" id="sideTitle">회계 매뉴얼</div>
      <div class="view-switch">
        <button class="on" data-view="type" onclick="switchView('type')">유형별</button>
        <button data-view="team" onclick="switchView('team')">팀별(조직도)</button>
      </div>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <!-- ===== 우측 컨텐츠 ===== -->
  <main class="content" id="content"></main>
</div>

<div class="mock-note">🎨 목업(Mockup) · 로그인·데이터는 Google Apps Script 연동 예정</div>

<script>
/* ================= 트리 정의 =================
 * key = tab + '|' + view  (acc|type, acc|team, tax|type, tax|team) */
const COMMON_ACC = [
  {id:'acc-c-invoice', name:'세금계산서·증빙'},
  {id:'acc-c-fx',      name:'해외 정산·환율 처리'},
  {id:'acc-c-terms',   name:'용어 사전'},
];
const COMMON_TAX = [
  {id:'tax-c-invoice', name:'세금계산서 증빙'},
  {id:'tax-c-3.3',     name:'개인 원천징수(3.3%)'},
  {id:'tax-c-terms',   name:'용어 사전'},
];

const CATS_BIZ = [
  {id:'platform', name:'플랫폼',   emoji:'📱'},
  {id:'dist',     name:'유통',     emoji:'📦'},
  {id:'video',    name:'영상',     emoji:'🎬'},
  {id:'snack',    name:'레진스낵', emoji:'🍿'},
  {id:'md',       name:'MD',       emoji:'🛍️'},
];
const TEAMS = [
  {id:'plan',     name:'기획제작팀',  emoji:'✏️'},
  {id:'invest',   name:'투자관리팀',  emoji:'💰'},
  {id:'platform', name:'플랫폼사업부', emoji:'📱'},
  {id:'video',    name:'영상사업부',   emoji:'🎬'},
  {id:'md',       name:'MD사업부',    emoji:'🛍️'},
];

const TREES = {
  'acc|type': {
    note:null,
    groups: CATS_BIZ.map(c=>({...c, leaves:['매출','MG(미니멈개런티)','정산','손익효과','회계처리 유의사항']})),
    common: COMMON_ACC
  },
  'acc|team': {
    note:'⚠️ 조직도 예시입니다 — 실제 사업부/팀명으로 교체 예정.',
    groups: TEAMS.map(t=>({...t, leaves:['매출','원가','판관비']})),
    common: COMMON_ACC
  },
  'tax|type': {
    note:null,
    groups: [
      {id:'vattype', name:'과세유형 (과세/면세/불공)', emoji:'🧾', leaves:['과세유형 개요','면세 판정','매입세액 불공제']},
      {id:'wht',     name:'원천징수·조세조약',         emoji:'🌐', leaves:['해외 사용료소득 제한세율','사전 필요서류','국가별 요약']},
      {id:'contract',name:'계약·사업자 전환',          emoji:'📝', leaves:['신규 계약 체크','작가 개인→사업자 전환']},
      {id:'vat',     name:'부가세 신고',               emoji:'📅', leaves:['신고 일정','전자적용역(웹툰) 유의']},
    ],
    common: COMMON_TAX
  },
  'tax|team': {
    note:'⚠️ 조직도 예시입니다 — 실제 사업부/팀명으로 교체 예정.',
    groups: TEAMS.map(t=>({...t, leaves:['거래 과세유형','원천징수 대상','증빙 관리']})),
    common: COMMON_TAX
  },
};

/* ================= 문서 본문 ================= */
const DOCS = {
  /* ---------- 회계: 유형별 ---------- */
  'platform/매출': {
    title:'플랫폼 — 매출 구조', crumb:['회계','플랫폼','매출'], chips:[['blue','매출인식']],
    body:`
      <div class="card"><h3><span class="bar"></span>매출 구조</h3>
        <p>플랫폼(자사 앱/웹)에서 발생하는 <strong>코인 결제 매출</strong>이 기본 단위입니다. 이용자가 충전한 코인으로 콘텐츠를 열람하면 그 시점에 매출로 인식합니다.</p>
        <div class="flow"><span class="step">코인 충전</span><span class="arrow">→</span><span class="step">콘텐츠 열람(코인 차감)</span><span class="arrow">→</span><span class="step hl">매출 인식</span><span class="arrow">→</span><span class="step">CP 정산</span></div>
      </div>
      <div class="card"><h3><span class="bar"></span>손익 효과 (예시)</h3>
        <table><tr><th>항목</th><th></th><th>비고</th></tr>
          <tr><td>총 결제액</td><td class="num">100</td><td>—</td></tr>
          <tr><td>앱 마켓 수수료(구글/애플)</td><td class="num">-30</td><td>30%</td></tr>
          <tr><td>CP(작가/제작사) 정산</td><td class="num">-35</td><td>정산율에 따라</td></tr>
          <tr class="total"><td>자사 귀속 손익</td><td class="num">35</td><td>Gross margin</td></tr></table>
        <div class="callout"><span class="ic">⚠️</span><p><strong>순액 vs 총액</strong> — 앱 마켓 수수료·CP 정산을 매출 차감(순액)으로 볼지 비용(총액)으로 볼지 계약·통제 기준으로 판단(K-IFRS 1115호 본인/대리인).</p></div>
      </div>`
  },
  'snack/매출': {
    title:'레진스낵 — 매출·정산 구조', crumb:['회계','레진스낵','매출'], chips:[['blue','매출인식'],['green','투자정산서']],
    body:`
      <div class="card"><h3><span class="bar"></span>매출 구조</h3>
        <p>레진스낵(숏드라마) 매출은 <strong>투자정산서 대상 매출</strong> 산정이 핵심입니다. 총 매출에서 단계별 차감을 거쳐 정산 기준 매출을 확정합니다.</p>
        <div class="flow"><span class="step">플랫폼 총매출</span><span class="arrow">→</span><span class="step">−30%</span><span class="arrow">→</span><span class="step">−30%</span><span class="arrow">→</span><span class="step hl">투자정산서 대상 매출</span></div>
      </div>
      <div class="card"><h3><span class="bar"></span>손익 효과 (예시)</h3>
        <table><tr><th>단계</th><th></th><th>비고</th></tr>
          <tr><td>플랫폼 총매출</td><td class="num">100</td><td>기준</td></tr>
          <tr><td>1차 차감 −30%</td><td class="num">-30</td><td>—</td></tr>
          <tr><td>2차 차감 −30%</td><td class="num">-21</td><td>잔액 기준</td></tr>
          <tr class="total"><td>정산 대상 매출</td><td class="num">49</td><td>투자정산서 반영</td></tr></table>
        <div class="callout"><span class="ic">🔒</span><p>자사수수료 등 세부 요율은 <strong>비공개 항목</strong> — 대외/타 부서 공유 자료에는 기재하지 않습니다.</p></div>
      </div>`
  },

  /* ---------- 회계: 팀별 ---------- */
  'plan/원가': {
    title:'기획제작팀 — 원가', crumb:['회계','팀별','기획제작팀','원가'], chips:[['blue','원가'],['amber','조직도 예시']],
    body:`
      <div class="card"><h3><span class="bar"></span>이 팀에서 발생하는 원가</h3>
        <ul><li><strong>제작원가</strong> — 작가·제작사 지급(MG·러닝 로열티), 외주 제작비</li>
        <li><strong>콘텐츠 자산화</strong> — 자체 IP 제작비의 무형자산/비용 처리 판단</li>
        <li><strong>선급/미지급</strong> — MG 선지급분의 상각·정산 대사</li></ul>
      </div>

/* ================= 상태 ================= */
let curTab='acc', curView='type', curKey='platform/매출';
const treeKey = ()=> curTab+'|'+curView;

/* ================= 렌더 ================= */
function renderTree(){
  const t=document.getElementById('tree');
  const tree=TREES[treeKey()];
  let html='';
  if(tree.note){ html+=`<div class="placeholder-note">${tree.note}</div>`; }
  tree.groups.forEach((g,i)=>{
    const open = curKey.startsWith(g.id+'/') || i===0 ? 'open':'';
    html+=`<div class="cat ${open}" id="cat-${g.id}">
      <button class="cat-head" onclick="toggleCat('${g.id}')"><span class="cat-emoji">${g.emoji}</span>${g.name}<span class="cat-arrow">▶</span></button>
      <div class="cat-items">${g.leaves.map(l=>{
        const key=g.id+'/'+l, short=l.split('(')[0];
        return `<button class="leaf ${curKey===key?'on':''}" onclick="openDoc('${key}')"><span class="dot"></span>${short}</button>`;
      }).join('')}</div></div>`;
  });
  html+=`<div class="side-divider"></div><div class="common-label">🔻 공통</div>`;
  tree.common.forEach(c=>{
    html+=`<button class="leaf ${curKey===c.id?'on':''}" style="margin:0 0 2px" onclick="openDoc('${c.id}')"><span class="dot"></span>${c.name}</button>`;
  });
  t.innerHTML=html;
}

function renderDoc(){
  const c=document.getElementById('content');
  const d=DOCS[curKey];
  if(d){
    c.innerHTML=`
      <div class="crumb">${d.crumb.map((x,i)=>i?`<span class="sep">/</span>${x}`:x).join(' ')}</div>
      <div class="doc-title">${d.title}</div>
      <div class="doc-meta">${d.chips.map(ch=>`<span class="chip ${ch[0]}">${ch[1]}</span>`).join('')}<span class="chip">최종수정 2026-07-21</span></div>
      ${d.body}`;
  } else {
    const tree=TREES[treeKey()];
    const parts=curKey.split('/');
    const g=(tree.groups.find(x=>x.id===parts[0])||{});
    const gName=g.name||'공통', leaf=(parts[1]||curKey).split('(')[0];
    c.innerHTML=`
      <div class="crumb">${gName} <span class="sep">/</span> ${leaf}</div>
      <div class="doc-title">${gName} — ${leaf}</div>
      <div class="doc-meta"><span class="chip amber">작성 예정</span></div>
      <div class="card"><h3><span class="bar"></span>개요</h3><p style="color:var(--gray-5)">이 항목의 매뉴얼을 작성하는 자리입니다. (구조·인식 기준·유의사항 등)</p></div>
      <div class="card"><h3><span class="bar"></span>핵심 포인트</h3><p style="color:var(--gray-5)">표·흐름도·체크리스트로 실무 포인트를 정리합니다.</p></div>`;
  }
  c.scrollTop=0;
}

/* ================= 인터랙션 ================= */
function toggleCat(id){ document.getElementById('cat-'+id).classList.toggle('open'); }
function openDoc(key){ curKey=key; renderTree(); renderDoc(); }

function firstKey(){ const tr=TREES[treeKey()]; return tr.groups[0].id+'/'+tr.groups[0].leaves[0]; }

function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.getElementById('sideTitle').textContent = tab==='acc'?'회계 매뉴얼':'세무 매뉴얼';
  if(tab==='acc') setUser('재무관리부 회계팀','문동진'); else setUser('재무관리부 세무팀','이지윤');
  curKey=firstKey(); renderTree(); renderDoc();
}
function switchView(view){
  curView=view;
  document.querySelectorAll('.view-switch button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  curKey=firstKey(); renderTree(); renderDoc();
}
function setUser(team,name){
  document.getElementById('userTeam').textContent=team;
  document.getElementById('userName').textContent=name;
  document.getElementById('userAvatar').textContent=name[0];
}
function switchCompany(btn,name,initial,color){
  document.querySelectorAll('.company-switch button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('companyName').textContent=name;
  const logo=document.getElementById('logo'); logo.textContent=initial; logo.style.background=color;
}

renderTree(); renderDoc();
</script>
