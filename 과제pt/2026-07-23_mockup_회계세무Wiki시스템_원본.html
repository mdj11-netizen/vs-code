<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회계/세무 Wiki — 목업</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#E8F3FF; --blue-deep:#1B64DA;
    --violet:#8B5CF6;
    --ink:#191F28; --gray-9:#333D4B; --gray-8:#2b3038; --gray-7:#4E5968; --gray-6:#6B7684;
    --gray-5:#8B95A1; --gray-4:#B0B8C1; --gray-3:#D1D6DB; --gray-2:#E5E8EB;
    --gray-1:#F2F4F6; --gray-05:#F9FAFB; --white:#fff;
    --radius:16px;
    --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--gray-1);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}

  /* ===== 상단 헤더 ===== */
  .topbar{height:60px;background:var(--white);border-bottom:1px solid var(--gray-2);display:flex;align-items:center;padding:0 24px;gap:18px;position:relative;z-index:10}
  .brand{display:flex;align-items:center;gap:12px;min-width:210px}
  .brand-logo{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;transition:.2s}
  .brand-logo-pair{display:flex;gap:4px;flex-shrink:0}
  .brand-logo-pair img{display:block;border-radius:9px;object-fit:contain}
  .brand-name{font-weight:800;font-size:18px;letter-spacing:-.3px}
  .brand-sub{font-size:12.5px;color:var(--gray-5);font-weight:600;margin-top:1px}
  .company-switch{margin-left:2px;display:flex;background:var(--gray-1);border-radius:8px;padding:3px}
  .company-switch button{font-size:12px;font-weight:700;color:var(--gray-6);padding:5px 11px;border-radius:6px;transition:.15s}
  .company-switch button.on{background:var(--white);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .topbar-tabs{display:flex;gap:4px;margin-left:6px}
  .tab{font-size:17px;font-weight:700;color:var(--gray-5);padding:8px 18px;border-radius:10px;transition:.15s}
  .tab.on{color:var(--blue);background:var(--blue-weak)}
  .tab .owner{display:block;font-size:11.5px;font-weight:600;color:var(--gray-4);margin-top:1px}
  .tab.on .owner{color:var(--blue-deep);opacity:.75}

  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .search{display:flex;align-items:center;gap:8px;background:var(--gray-1);border-radius:10px;padding:9px 14px;width:240px;color:var(--gray-5);font-size:13px}
  .search input{border:none;background:none;outline:none;font-size:13px;flex:1;color:var(--ink)}
  .user{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-radius:12px;background:var(--gray-05);border:1px solid var(--gray-2)}
  .user-meta{text-align:right;line-height:1.25}
  .user-team{font-size:11px;color:var(--gray-5);font-weight:600}
  .user-name{font-size:13px;font-weight:800}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3182F6,#1B64DA);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}

  /* ===== 레이아웃 ===== */
  .layout{display:flex;height:calc(100vh - 60px)}

  /* ===== 좌측 사이드바 ===== */
  .sidebar{width:292px;background:var(--white);border-right:1px solid var(--gray-2);display:flex;flex-direction:column;flex-shrink:0}
  .side-head{padding:18px 20px 10px}
  .side-title{font-size:15px;font-weight:800;color:var(--gray-6);letter-spacing:.2px;margin-bottom:12px}
  .view-switch{display:flex;background:var(--gray-1);border-radius:10px;padding:3px}
  .view-switch button{flex:1;font-size:14px;font-weight:700;color:var(--gray-6);padding:8px 0;border-radius:7px;transition:.15s}
  .view-switch button.on{background:var(--white);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  .tree{flex:1;overflow-y:auto;padding:6px 12px 24px}
  .tree::-webkit-scrollbar{width:8px}.tree::-webkit-scrollbar-thumb{background:var(--gray-3);border-radius:8px}

  .cat{margin-bottom:2px}
  .cat-head{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;font-weight:700;font-size:16px;color:var(--gray-9);transition:.12s;width:100%;text-align:left}
  .cat-head:hover{background:var(--gray-05)}
  .cat-emoji{font-size:17px;width:18px;text-align:center}
  .cat-arrow{margin-left:auto;color:var(--gray-4);font-size:11px;transition:.2s}
  .cat.open .cat-arrow{transform:rotate(90deg)}
  .cat-items{display:none;padding:2px 0 6px 22px;margin-left:8px;border-left:1.5px solid var(--gray-2)}
  .cat.open .cat-items{display:block}
  .leaf{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14.5px;color:var(--gray-7);font-weight:500;transition:.12s;width:100%;text-align:left}
  .leaf:hover{background:var(--gray-05);color:var(--gray-9)}
  .leaf.on{background:var(--blue-weak);color:var(--blue-deep);font-weight:700}
  .leaf .dot{width:5px;height:5px;border-radius:50%;background:var(--gray-4);flex-shrink:0}
  .leaf.on .dot{background:var(--blue)}

  .side-divider{margin:14px 20px 10px;border-top:1px solid var(--gray-2)}
  .common-label{padding:0 20px 6px;font-size:12.5px;font-weight:800;color:var(--gray-5);letter-spacing:.3px}
  .placeholder-note{margin:2px 12px 8px;font-size:11px;color:var(--gray-5);background:#FFF9EB;border:1px solid #FFE9AE;border-radius:8px;padding:8px 10px;line-height:1.5}

  /* ===== 우측 컨텐츠 ===== */
  .content{flex:1;overflow-y:auto;padding:32px 40px 60px}
  .content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--gray-3);border-radius:8px}
  .crumb{font-size:12.5px;color:var(--gray-5);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .crumb .sep{color:var(--gray-3)}
  .doc-title{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px}
  .doc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .chip{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px;background:var(--gray-1);color:var(--gray-6)}
  .chip.blue{background:var(--blue-weak);color:var(--blue-deep)}
  .chip.green{background:#E7F7EF;color:#0F9D58}
  .chip.red{background:#FDECEC;color:#E03E3E}
  .chip.amber{background:#FFF4DE;color:#B7791F}

  .card{position:relative;overflow:hidden;background:var(--white);border:1px solid var(--gray-2);border-radius:var(--radius);padding:30px 32px;margin-bottom:24px;box-shadow:var(--shadow)}
  .card h3{font-size:18px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .card h3 .bar{width:4px;height:19px;background:var(--blue);border-radius:3px}
  .card h3 .bar.warn{background:#F0B429}
  .card p{font-size:14.5px;line-height:1.75;color:var(--gray-7)}
  .card p + p{margin-top:11px}
  .card strong{color:var(--ink);font-weight:700}
  .card ul{margin:8px 0 0 2px;padding:0;list-style:none}
  .card li{font-size:14px;line-height:1.7;color:var(--gray-7);padding-left:18px;position:relative}
  .card li::before{content:'';position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
  .card li+li{margin-top:6px}
  .section-gap{margin-top:18px}

  /* ---- 카드 아코디언(제목 클릭 시 펼쳐짐, 기본은 닫힘) ---- */
  .card > summary{cursor:pointer;list-style:none;font-size:18px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:0}
  .card > summary::-webkit-details-marker{display:none}
  .card > summary .fold-caret{margin-left:auto;font-size:13px;color:var(--gray-4);transition:transform .15s}
  .card[open] > summary{margin-bottom:18px}
  .card[open] > summary .fold-caret{transform:rotate(180deg)}

  /* ---- 섹션 구분 라벨(제작비: MG vs 즉시비용처리) ---- */
  .section-block{margin-top:26px;padding-top:20px;border-top:2px solid var(--gray-3)}
  .section-block:first-of-type{margin-top:16px}
  .section-title{display:inline-block;font-size:15px;font-weight:800;padding:6px 16px;border-radius:8px;margin-bottom:16px}
  .section-title.blue{background:var(--blue-weak);color:var(--blue-deep)}
  .section-title.amber{background:#FFF4DE;color:#B7791F}

  /* ---- 프로세스 흐름도(정적, 세무 문서용) ---- */
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
  .flow .step{background:var(--gray-05);border:1px solid var(--gray-2);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--gray-9)}
  .flow .arrow{color:var(--gray-4);font-weight:800}
  .flow .step.hl{background:var(--blue-weak);border-color:#cfe3ff;color:var(--blue-deep)}

  /* ---- 정보 위계: 핵심 원칙 / 예시 ---- */
  .principle{font-size:16px;font-weight:800;color:var(--ink);line-height:1.6;margin-bottom:8px}
  .example-quote{margin-top:18px;padding:13px 17px;background:var(--gray-05);border-radius:8px;font-size:13.5px;color:var(--gray-6);font-style:italic;line-height:1.7}

  /* ---- 예시 손익 분해(세로) ---- */
  .example-breakdown{margin-top:18px;padding:16px 20px;background:var(--gray-05);border-radius:8px;font-size:13.5px;color:var(--gray-7)}
  .example-breakdown .eb-head{font-weight:700;color:var(--gray-9);margin-bottom:8px;padding:4px 8px;margin-left:-8px;margin-right:-8px;border-radius:6px;transition:background .15s,color .15s}
  .example-breakdown .eb-line{display:flex;gap:8px;padding:4px 8px;margin:0 -8px;border-radius:6px;transition:background .15s}
  .example-breakdown .eb-line .amt{font-weight:700;font-variant-numeric:tabular-nums}
  .example-breakdown .eb-line .note{color:var(--gray-5);font-weight:400}
  .example-breakdown .eb-line.plus .amt{color:#0F9D58}
  .example-breakdown .eb-line.minus .amt{color:#E03E3E}
  .example-breakdown .eb-line.total{margin-top:6px;padding-top:10px;border-top:1px solid var(--gray-2);font-weight:800;color:var(--ink)}
  .example-breakdown .eb-line.total .amt{color:var(--blue-deep)}
  .example-breakdown [data-eb].active{background:var(--blue-weak)}
  .example-breakdown .eb-head.active{color:var(--blue-deep)}

  /* ---- 프로세스 스테퍼(클릭형, 박스) ---- */
  .stepper{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .stepper .node{width:auto;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;white-space:nowrap;border-radius:10px;padding:8px 16px;font-size:15.5px;font-weight:700;line-height:1.4;cursor:pointer;transition:.15s;background:var(--white);border:1px solid var(--gray-2);color:var(--gray-9)}
  .stepper .node small{display:block;font-size:12.5px;font-weight:600;color:var(--gray-5);margin-top:3px}
  .stepper .node:hover{border-color:#cfe3ff}
  .stepper .arrow{align-self:center;color:var(--gray-4);font-weight:800}
  .stepper .node.hl{background:var(--blue-weak);border-color:#cfe3ff;color:var(--blue-deep)}
  .stepper .node.hl small{color:var(--blue-deep);opacity:.75}
  .flow-detail{display:none;margin-top:16px;background:var(--gray-05);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:14px 18px}
  .flow-detail.show{display:block}
  .flow-detail p{font-size:13.5px;font-weight:500;color:var(--gray-9);line-height:1.7;margin:0}
  .flow-detail p+p{margin-top:8px}

  /* ---- 번호형 단계 리스트 ---- */
  .steps{list-style:none;margin:14px 0 0;padding:0}
  .steps li{display:flex;gap:13px;padding:13px 0}
  .steps li+li{border-top:1px solid var(--gray-1)}
  .steps .num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--blue-weak);color:var(--blue-deep);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .steps .step-body{flex:1}
  .steps .step-body strong{display:block;font-size:15.5px;color:var(--ink);margin-bottom:3px}
  .steps .step-body p{font-size:13.5px;color:var(--gray-7);line-height:1.65;margin:0}

  table{width:auto;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:center;padding:12px 15px;vertical-align:middle;border-bottom:1px solid var(--gray-3)}
  tr:last-child td{border-bottom:none}
  th{font-size:13.5px;font-weight:800;color:var(--gray-6);background:var(--gray-05)}
  td{color:var(--gray-7);line-height:1.6}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--gray-9)}
  tr.total td{background:var(--blue-weak);font-weight:800;color:var(--blue-deep)}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px}
  .tag.g{background:#E7F7EF;color:#0F9D58}.tag.r{background:#FDECEC;color:#E03E3E}.tag.a{background:#FFF4DE;color:#B7791F}.tag.b{background:var(--blue-weak);color:var(--blue-deep)}

  /* ---- 콜아웃(이모지 없이 라벨+컬러바) ---- */
  .callout{background:#FFF9EB;border:1px solid #FFE9AE;border-left:3px solid #F0B429;border-radius:10px;padding:13px 16px 14px;margin-top:14px}
  .callout.blue{background:var(--blue-weak);border-color:#cfe3ff;border-left-color:var(--blue)}
  .callout-label{display:block;font-size:12.5px;font-weight:800;letter-spacing:.2px;color:#B7791F;margin-bottom:5px}
  .callout.blue .callout-label{color:var(--blue-deep)}
  .callout p{font-size:14.5px;line-height:1.7;color:#8A6D1B;margin:0}
  .callout.blue p{color:var(--blue-deep)}
  .callout strong{color:#6b530f}.callout.blue strong{color:var(--blue-deep)}

  /* ---- 유의사항 카드형 리스트 ---- */
  .warn-list{display:flex;flex-direction:column;gap:11px;margin-top:12px}
  .warn-item{background:#FFFBF0;border:1px solid #FFE9AE;border-left:3px solid #F0B429;border-radius:10px;padding:13px 16px}
  .warn-item strong{display:block;font-size:15.5px;color:#8A6D1B;margin-bottom:4px}
  .warn-item p{font-size:14.5px;color:#6b5720;line-height:1.7;margin:0}

  /* ---- 나란히 비교 (2열) ---- */
  .dual{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:12px;align-items:start}
  .dual>div{min-width:0}

  /* ---- 조건 비교 카드 ---- */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .compare .cond{border-radius:10px;padding:15px 17px;border:1px solid var(--gray-2)}
  .compare .cond.a{background:var(--gray-05)}
  .compare .cond.b{background:var(--blue-weak);border-color:#cfe3ff}
  .compare .cond .rule{font-size:15.5px;font-weight:800;margin-bottom:7px}
  .compare .cond.a .rule{color:var(--gray-7)}
  .compare .cond.b .rule{color:var(--blue-deep)}
  .compare .cond p{font-size:13px;color:var(--gray-6);line-height:1.6;margin:0}

  .kv{display:grid;grid-template-columns:150px 1fr;gap:11px 16px;font-size:13.5px}
  .kv .k{color:var(--gray-5);font-weight:700}
  .kv .v{color:var(--gray-9);font-weight:500;line-height:1.6}

  /* ---- 카드 내 소제목 ---- */
  .subhead{font-size:15.5px;font-weight:800;color:var(--ink);margin:22px 0 9px}
  .subhead:first-child{margin-top:0}
  .subhead small{display:block;font-size:12.5px;font-weight:600;color:var(--gray-5);margin-top:4px}

  /* ---- 분개(차변/대변) 표 & 토글 ---- */
  .jr-table{width:auto;margin-top:10px;font-size:13.5px}
  .jr-table th,.jr-table td{white-space:nowrap;text-align:center}
  .jr-table th{background:var(--gray-2)}
  .jr-table td{color:var(--ink);font-weight:400;background:var(--white)}
  .jr-code{margin-top:8px;font-size:13px;color:var(--gray-5);font-weight:600}
  .jr-toggle{margin-top:16px}
  .jr-toggle summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--blue-deep);list-style:none;display:inline-flex;align-items:center;gap:5px;user-select:none}
  .jr-toggle summary::-webkit-details-marker{display:none}
  .jr-toggle summary::before{content:'▶';font-size:9px;color:var(--gray-4);transition:.15s}
  .jr-toggle[open] summary::before{transform:rotate(90deg)}
  .jr-toggle summary:hover{color:var(--blue)}
  .jr-toggle .jr-table,.jr-toggle .s2-table{margin-top:10px}
  .s2-table{width:100%;table-layout:fixed}
  .s2-table th{background:var(--blue-weak);color:var(--blue-deep);text-align:left}
  .s2-table th:first-child,.s2-table td:first-child{width:120px}
  .s2-table td{font-size:13px;color:var(--gray-6);line-height:1.55;text-align:left}
  .jr-label{font-size:13px;font-weight:700;color:var(--gray-6);margin:12px 0 5px}
  .jr-label:first-child{margin-top:0}

  /* ---- 분류코드 패널 (카드 내부에서 슬라이드) ---- */
  .s2-link{margin-top:16px;padding:0;font-size:13px;font-weight:700;color:var(--blue-deep);display:inline-flex;align-items:center;gap:5px}
  .s2-link::before{content:'▶';font-size:9px;color:var(--gray-4)}
  .s2-link:hover{color:var(--blue)}
  .s2-drawer{position:absolute;top:0;right:0;height:100%;width:62%;max-width:460px;min-width:280px;background:var(--white);border-left:1px solid var(--gray-2);box-shadow:-10px 0 20px rgba(0,0,0,.08);z-index:5;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;min-height:0}
  .s2-drawer.show{transform:translateX(0)}
  .s2-drawer-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--gray-2);font-size:15.5px;font-weight:800;color:var(--ink);flex-shrink:0}
  .s2-drawer-head button{font-size:15px;color:var(--gray-6);padding:5px 8px;border-radius:8px;flex-shrink:0}
  .s2-drawer-head button:hover{background:var(--gray-05);color:var(--gray-9)}
  .s2-drawer-body{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;padding:0 20px 16px}
  .s2-drawer-body .s2-table th,.s2-drawer-body .s2-table td{white-space:normal;word-break:break-word}

  .check li::before{content:'✓';background:none;color:var(--blue);font-weight:800;font-size:13px;top:2px;left:0}
  .check li{padding-left:22px}

  .mock-note{position:fixed;bottom:16px;right:20px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:8px 14px;border-radius:20px;opacity:.82;z-index:50}
</style>
</head>
<body>

<!-- ===== 상단 헤더 ===== -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo-pair" id="logo">
      <img src="키다리 로고.png" alt="키다리스튜디오" width="34" height="34">
      <img src="레진로고.png" alt="레진엔터테인먼트" width="34" height="34">
    </div>
    <div>
      <div class="brand-name" id="companyName">키다리/레진</div>
      <div class="brand-sub">회계/세무 Wiki</div>
    </div>
  </div>

  <nav class="topbar-tabs">
    <button class="tab on" data-tab="acc" onclick="switchTab('acc')">
      회계 <span class="owner">담당 · 문동진</span>
    </button>
    <button class="tab" data-tab="tax" onclick="switchTab('tax')">
      세무 <span class="owner">담당 · 이지윤</span>
    </button>

function showStep(btn,flowId,stepId){
  const flow=btn.closest('.stepper');
  flow.querySelectorAll('.node').forEach(s=>s.classList.remove('hl'));
  btn.classList.add('hl');
  const detail=document.getElementById('flow-detail-'+flowId);
  const data=(STEP_DETAILS[flowId]||{})[stepId];
  if(detail && data){
    detail.innerHTML=data.body;
    detail.classList.add('show');
  }
  const eb=document.getElementById('eb-'+flowId);
  if(eb){
    eb.querySelectorAll('[data-eb]').forEach(el=>el.classList.remove('active'));
    const target=eb.querySelector(`[data-eb="${stepId}"]`);
    if(target) target.classList.add('active');
  }
}

function openS2(btn){
  const src=btn.nextElementSibling;
  const card=btn.closest('.card');
  if(!src || !card) return;
  const drawer=document.getElementById('s2Drawer');
  card.appendChild(drawer);
  document.getElementById('s2DrawerBody').innerHTML=src.innerHTML;
  drawer.classList.add('show');
}
function closeS2(){
  const drawer=document.getElementById('s2Drawer');
  if(!drawer) return;
  drawer.classList.remove('show');
  document.getElementById('s2Home').appendChild(drawer);
}
document.addEventListener('click',function(e){
  const drawer=document.getElementById('s2Drawer');
  if(!drawer.classList.contains('show')) return;
  if(drawer.contains(e.target) || e.target.classList.contains('s2-link')) return;
  closeS2();
});

/* ================= 상태 ================= */
let curTab='acc', curView='type', curKey='platform/매출구조';
const treeKey = ()=> curTab+'|'+curView;

/* ================= 렌더 ================= */
let openCatSets={};
function getOpenSet(){
  const key=treeKey();
  if(!openCatSets[key]){ openCatSets[key]=new Set([TREES[key].groups[0].id]); }
  return openCatSets[key];
}
function renderTree(){
  const t=document.getElementById('tree');
  const tree=TREES[treeKey()];
  const openSet=getOpenSet();
  const curGroupId=curKey.split('/')[0];
  if(tree.groups.some(g=>g.id===curGroupId)) openSet.add(curGroupId);
  let html='';
  if(tree.note){ html+=`<div class="placeholder-note">${tree.note}</div>`; }
  tree.groups.forEach((g,i)=>{
    const open = openSet.has(g.id) ? 'open':'';
    html+=`<div class="cat ${open}" id="cat-${g.id}">
      <button class="cat-head" onclick="toggleCat('${g.id}')"><span class="cat-emoji">${g.emoji}</span>${g.name}<span class="cat-arrow">▶</span></button>
      <div class="cat-items">${g.leaves.map(l=>{
        const key=g.id+'/'+l, short=l.split('(')[0];
        return `<button class="leaf ${curKey===key?'on':''}" onclick="openDoc('${key}')"><span class="dot"></span>${short}</button>`;
      }).join('')}</div></div>`;
  });
  html+=`<div class="side-divider"></div><div class="common-label">🔻 공통</div>`;
  tree.common.forEach(c=>{
    html+=`<button class="leaf ${curKey===c.id?'on':''}" style="margin:0 0 2px" onclick="openDoc('${c.id}')"><span class="dot"></span>${c.name}</button>`;
  });
  t.innerHTML=html;
}

function renderDoc(){
  const c=document.getElementById('content');
  const d=DOCS[curKey];
  if(d){
    c.innerHTML=`
      <div class="crumb">${d.crumb.map((x,i)=>i?`<span class="sep">/</span>${x}`:x).join(' ')}</div>
      <div class="doc-title">${d.title}</div>
      <div class="doc-meta">${d.chips.map(ch=>`<span class="chip ${ch[0]}">${ch[1]}</span>`).join('')}<span class="chip">최종수정 2026-07-23</span></div>
      ${d.body}`;
  } else {
    const tree=TREES[treeKey()];
    const parts=curKey.split('/');
    const g=(tree.groups.find(x=>x.id===parts[0])||{});
    const gName=g.name||'공통', leaf=(parts[1]||curKey).split('(')[0];
    c.innerHTML=`
      <div class="crumb">${gName} <span class="sep">/</span> ${leaf}</div>
      <div class="doc-title">${gName} — ${leaf}</div>
      <div class="doc-meta"><span class="chip amber">작성 예정</span></div>
      <div class="card"><h3><span class="bar"></span>개요</h3><p style="color:var(--gray-5)">이 항목의 매뉴얼을 작성하는 자리입니다. (구조·인식 기준·유의사항 등)</p></div>
      <div class="card"><h3><span class="bar"></span>핵심 포인트</h3><p style="color:var(--gray-5)">표·흐름도·체크리스트로 실무 포인트를 정리합니다.</p></div>`;
  }
  const firstNode=c.querySelector('.stepper .node');
  if(firstNode) firstNode.click();
  c.scrollTop=0;
}

/* ================= 인터랙션 ================= */
function toggleCat(id){
  const s=getOpenSet();
  if(s.has(id)) s.delete(id); else s.add(id);
  document.getElementById('cat-'+id).classList.toggle('open');
}
function openDoc(key){ closeS2(); curKey=key; renderTree(); renderDoc(); }

function firstKey(){ const tr=TREES[treeKey()]; return tr.groups[0].id+'/'+tr.groups[0].leaves[0]; }

function switchTab(tab){
  closeS2();
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.getElementById('sideTitle').textContent = tab==='acc'?'회계 매뉴얼':'세무 매뉴얼';
  if(tab==='acc') setUser('재무관리부 회계팀','문동진'); else setUser('재무관리부 세무팀','이지윤');
  curKey=firstKey(); renderTree(); renderDoc();
}
function switchView(view){
  closeS2();
  curView=view;
  document.querySelectorAll('.view-switch button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  curKey=firstKey(); renderTree(); renderDoc();
}
function setUser(team,name){
  document.getElementById('userTeam').textContent=team;
  document.getElementById('userName').textContent=name;
  document.getElementById('userAvatar').textContent=name[0];
}

renderTree(); renderDoc();
</script>
